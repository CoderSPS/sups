<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SUPS</title>
</head>
<body>
    <div class="login-form">
        <h1>Login</h1>
        <div class="container">
            <div class="main">
                <div class="content">
                    <h2>Log In</h2>
                    <form  action="" method="post">
                        <input type="email" name="" placeholder="Email" required autofocus="">
                        <input type="text" name="" placeholder="Username" required autofocus="">
                        <input type="password" name="" placeholder="Password" required autofocus="">
                        <button class="btn" type="submit">
                            Login
                        </button>
                    </form>
                    <p class="account">Don't have an account? <a href="signup.html">Sign Up</a></p>
                </div>
                <div class="form-img">
                    <img src="login.png" alt="Login Image">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
