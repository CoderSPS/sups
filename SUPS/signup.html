<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <title>SUPS - Sign Up & Login</title>
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .auth-box {
            width: 100%;
            max-width: 400px;
            background-color: #0f0f0f;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 0 20px rgba(143, 212, 255, 0.2);
        }

        .auth-title {
            font-family: "Inter", sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .auth-subtitle {
            color: #b0b0b0;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: #ffffff;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            background-color: #1a1a1a;
            border: 1px solid #2b2b2b;
            border-radius: 0.5rem;
            color: #ffffff;
            font-family: "Source Sans 3", sans-serif;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #8fd4ff;
            box-shadow: 0 0 8px rgba(143, 212, 255, 0.3);
        }

        .submit-btn {
            width: 100%;
            padding: 0.75rem;
            background-color: #8fd4ff;
            color: #070707;
            border: none;
            border-radius: 0.5rem;
            font-family: "Source Sans 3", sans-serif;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .submit-btn:hover {
            background-color: #74c4ff;
            box-shadow: 0 0 12px rgba(143, 212, 255, 0.45);
        }

        .toggle-form {
            text-align: center;
            margin-top: 1.5rem;
            color: #b0b0b0;
            font-size: 0.9rem;
        }

        .toggle-form a {
            color: #8fd4ff;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }

        .toggle-form a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
        }

        .success-message {
            color: #4ade80;
            font-size: 0.9rem;
            padding: 0.75rem;
            background-color: #1a3a1a;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            display: none;
            text-align: center;
        }

        .hidden {
            display: none;
        }

        .navbar {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 1rem;
            padding: 0 1rem;
            background-color: #070707;
        }

        .logolink {
            height: 50px;
            width: 50px;
        }
    </style>
</head>
<body>
    <nav>
        <div class="navbar">
            <div><a href="index.html"><img class="logolink" src="SPSLogo.png" alt="SPS Logo"></a></div>
            <div style="margin-left: auto;"><a href="index.html" style="color: #ffffff; text-decoration: none;">Back to Home</a></div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-box">
            <!-- Sign Up Form -->
            <div id="signup-form">
                <h2 class="auth-title">Sign Up</h2>
                <p class="auth-subtitle">Create a new account</p>
                <div class="success-message" id="signup-success">Account created successfully!</div>
                
                <form id="signup-input">
                    <div class="form-group">
                        <label for="signup-name">Full Name</label>
                        <input type="text" id="signup-name" placeholder="Enter your full name" required>
                        <div class="error-message" id="name-error"></div>
                    </div>

                    <div class="form-group">
                        <label for="signup-email">Email</label>
                        <input type="email" id="signup-email" placeholder="Enter your email" required>
                        <div class="error-message" id="email-error"></div>
                    </div>

                    <div class="form-group">
                        <label for="signup-password">Password</label>
                        <input type="password" id="signup-password" placeholder="Create a password" required>
                        <div class="error-message" id="password-error"></div>
                    </div>

                    <div class="form-group">
                        <label for="signup-confirm">Confirm Password</label>
                        <input type="password" id="signup-confirm" placeholder="Confirm your password" required>
                        <div class="error-message" id="confirm-error"></div>
                    </div>

                    <button type="submit" class="submit-btn">Sign Up</button>
                </form>

                <div class="toggle-form">
                    Already have an account? <a onclick="toggleForm()">Log In</a>
                </div>
            </div>

            <!-- Log In Form -->
            <div id="login-form" class="hidden">
                <h2 class="auth-title">Log In</h2>
                <p class="auth-subtitle">Welcome back</p>
                <div class="success-message" id="login-success">Logged in successfully!</div>

                <form id="login-input">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" placeholder="Enter your email" required>
                        <div class="error-message" id="login-email-error"></div>
                    </div>

                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="Enter your password" required>
                        <div class="error-message" id="login-password-error"></div>
                    </div>

                    <button type="submit" class="submit-btn">Log In</button>
                </form>

                <div class="toggle-form">
                    Don't have an account? <a onclick="toggleForm()">Sign Up</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleForm() {
            const signupForm = document.getElementById('signup-form');
            const loginForm = document.getElementById('login-form');
            
            signupForm.classList.toggle('hidden');
            loginForm.classList.toggle('hidden');
            
            // Clear error messages
            document.querySelectorAll('.error-message').forEach(msg => msg.style.display = 'none');
            document.querySelectorAll('.success-message').forEach(msg => msg.style.display = 'none');
        }

        // Sign Up Handler
        document.getElementById('signup-input').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('signup-confirm').value;

            // Clear previous errors
            document.querySelectorAll('.error-message').forEach(msg => msg.style.display = 'none');

            let hasError = false;

            if (!name) {
                document.getElementById('name-error').textContent = 'Name is required';
                document.getElementById('name-error').style.display = 'block';
                hasError = true;
            }

            if (!email) {
                document.getElementById('email-error').textContent = 'Email is required';
                document.getElementById('email-error').style.display = 'block';
                hasError = true;
            } else if (!isValidEmail(email)) {
                document.getElementById('email-error').textContent = 'Invalid email format';
                document.getElementById('email-error').style.display = 'block';
                hasError = true;
            }

            if (password.length < 6) {
                document.getElementById('password-error').textContent = 'Password must be at least 6 characters';
                document.getElementById('password-error').style.display = 'block';
                hasError = true;
            }

            if (password !== confirmPassword) {
                document.getElementById('confirm-error').textContent = 'Passwords do not match';
                document.getElementById('confirm-error').style.display = 'block';
                hasError = true;
            }

            // Check if email already exists
            const users = JSON.parse(localStorage.getItem('users')) || [];
            if (users.some(user => user.email === email)) {
                document.getElementById('email-error').textContent = 'Email already registered';
                document.getElementById('email-error').style.display = 'block';
                hasError = true;
            }

            if (!hasError) {
                // Save user
                users.push({ name, email, password });
                localStorage.setItem('users', JSON.stringify(users));
                localStorage.setItem('currentUser', JSON.stringify({ name, email }));
                
                // Show success message
                document.getElementById('signup-success').style.display = 'block';
                this.reset();
                
                setTimeout(() => {
                    alert(`Welcome ${name}! Your account has been created.`);
                    window.location.href = 'index.html';
                }, 1500);
            }
        });

        // Log In Handler
        document.getElementById('login-input').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            // Clear previous errors
            document.querySelectorAll('.error-message').forEach(msg => msg.style.display = 'none');

            let hasError = false;

            if (!email || !password) {
                if (!email) {
                    document.getElementById('login-email-error').textContent = 'Email is required';
                    document.getElementById('login-email-error').style.display = 'block';
                }
                if (!password) {
                    document.getElementById('login-password-error').textContent = 'Password is required';
                    document.getElementById('login-password-error').style.display = 'block';
                }
                hasError = true;
            }

            if (!hasError) {
                // Find user
                const users = JSON.parse(localStorage.getItem('users')) || [];
                const user = users.find(u => u.email === email && u.password === password);

                if (user) {
                    localStorage.setItem('currentUser', JSON.stringify({ name: user.name, email: user.email }));
                    document.getElementById('login-success').style.display = 'block';
                    
                    setTimeout(() => {
                        alert(`Welcome back, ${user.name}!`);
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    document.getElementById('login-email-error').textContent = 'Invalid email or password';
                    document.getElementById('login-email-error').style.display = 'block';
                }
            }
        });

        function isValidEmail(email) {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return regex.test(email);
        }
    </script>
</body>
</html>
